name: Android APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "src/**"
      - "qml/**"
      - "icons/**"
      - "android/**"
      - "CMakeLists.txt"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"
  ANDROID_API: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK_VERSION: "26.1.10909125"

jobs:
  build-android:
    name: Build XdrMini arm64 APK
    runs-on: ubuntu-24.04

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Java 17 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Android SDK / NDK Pakete installieren
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platform-tools"             "platforms;android-${ANDROID_API}"             "build-tools;${ANDROID_BUILD_TOOLS}"             "ndk;${ANDROID_NDK_VERSION}"

      - name: Ninja installieren
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Qt 6.8.3 fuer Android ARM64 installieren
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: "${{ env.QT_VERSION }}"
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: qtserialport
          cache: true
          install-deps: true

      - name: Build-Umgebung anzeigen
        shell: bash
        run: |
          java -version
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "QT_ROOT_DIR=${QT_ROOT_DIR}"
          echo "NDK=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          test -x "${QT_ROOT_DIR}/bin/qt-cmake"
          test -d "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

      - name: XdrMini fuer Android konfigurieren
        shell: bash
        run: |
          rm -rf build-android
          "${QT_ROOT_DIR}/bin/qt-cmake"             -S .             -B build-android             -GNinja             -DCMAKE_BUILD_TYPE=Release             -DANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}"             -DANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

      - name: APK bauen
        shell: bash
        run: |
          cmake --build build-android --target apk --parallel

      - name: APK einsammeln
        shell: bash
        run: |
          echo "Gefundene APK-Dateien:"
          find build-android -type f -name "*.apk" -print

          APK="$(find build-android -type f -name "*.apk" | head -n 1)"

          if [ -z "${APK}" ]; then
            echo "Fehler: Keine APK gefunden."
            exit 1
          fi

          mkdir -p dist
          cp "${APK}" dist/XdrMini-arm64-v8a.apk

          ls -lh dist/XdrMini-arm64-v8a.apk

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v7
        with:
          name: XdrMini-Android-APK
          path: dist/XdrMini-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
