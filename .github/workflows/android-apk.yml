name: Android APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "qml/**"
      - "icons/**"
      - "android/**"
      - "CMakeLists.txt"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"
  ANDROID_API: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK_VERSION: "26.1.10909125"

jobs:
  build-android:
    name: XdrMini arm64 Test-APK erstellen
    runs-on: ubuntu-24.04

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4

      - name: Android SDK / NDK installieren
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Ninja installieren
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Qt 6.8.3 Desktop Host installieren
        uses: jurplel/install-qt-action@v4
        with:
          version: "${{ env.QT_VERSION }}"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: "qtserialport qtpositioning"
          dir: "${{ runner.temp }}"
          cache: true
          cache-key-prefix: xdrmini-qt-desktop

      - name: Qt 6.8.3 Android ARM64 installieren
        uses: jurplel/install-qt-action@v4
        with:
          version: "${{ env.QT_VERSION }}"
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: "qtserialport qtpositioning"
          dir: "${{ runner.temp }}"
          cache: true
          cache-key-prefix: xdrmini-qt-android-arm64

      - name: XdrMini fuer Android konfigurieren
        shell: bash
        run: |
          QT_BASE="${RUNNER_TEMP}/Qt/${QT_VERSION}"
          QT_HOST="${QT_BASE}/gcc_64"
          QT_ANDROID="${QT_BASE}/android_arm64_v8a"
          NDK="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

          rm -rf build-android

          "${QT_ANDROID}/bin/qt-cmake" \
            -S . \
            -B build-android \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQT_ANDROID_DEPLOYMENT_TYPE=Debug \
            -DQT_HOST_PATH="${QT_HOST}" \
            -DANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}" \
            -DANDROID_NDK_ROOT="${NDK}" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28

      - name: Debug-APK bauen
        shell: bash
        run: |
          cmake --build build-android --target apk --parallel

      - name: Signierte APK pruefen und einsammeln
        shell: bash
        run: |
          echo "Alle erzeugten APK-Dateien:"
          find build-android -type f -name "*.apk" -print

          APK="$(find build-android -type f -name "*.apk" ! -name "*unsigned*" | head -n 1)"

          if [ -z "${APK}" ]; then
            echo "Fehler: Keine signierte APK gefunden."
            exit 1
          fi

          echo "Verwendete APK: ${APK}"

          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          "${APKSIGNER}" verify --verbose --print-certs "${APK}"

          mkdir -p dist
          cp "${APK}" dist/XdrMini-arm64-v8a-debug.apk
          ls -lh dist/XdrMini-arm64-v8a-debug.apk

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: XdrMini-Android-Test-APK
          path: dist/XdrMini-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
